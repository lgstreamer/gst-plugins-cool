{
    "contexts" : [
        {
            "name" : "gst.tracer",
            "level" : "info",
            "logProcessIds" : true,
            "logThreadIds" : true,
            "logToConsole" : false,
            "rules" : [
                {"filter" : "*.*", "output" : "gstreamer-log"}
            ]
        }
    ],
    "outputs" : [
        {
            "name" : "gstreamer-log",
            "file" : "@WEBOS_INSTALL_LOGDIR@/messages",
            "maxSize" : 20000,
            "rotations" : 5
        }
    ]
}
